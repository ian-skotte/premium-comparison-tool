<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Partners for Health – 2026 Plan Finder</title>
<style>
:root{
  --blue:#123f73;--blue2:#1a5298;--red:#c8102e;--gold:#f2b84b;
  --green:#1f7a4d;--ink:#1d2733;--muted:#5f6b7a;--line:#d9e1ea;
  --bg:#f0f5fb;--card:#fff;--lb:#eaf4fb;
  --shadow:0 8px 28px rgba(18,63,115,.11);--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#123f73,#0a2d52 70%);padding:28px 20px 24px;text-align:center;color:#fff;}
.hdr .eyebrow{display:inline-block;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;font-size:12px;color:#c8dff5;margin-bottom:10px;}
.hdr h1{font-size:clamp(22px,4vw,38px);letter-spacing:-.02em;line-height:1.1;margin-bottom:8px;}
.hdr p{color:#cce0f5;font-size:15px;max-width:560px;margin:0 auto;}

/* ── PROGRESS ── */
.progress-bar{background:#e0eaf4;height:4px;}
.progress-fill{background:var(--gold);height:4px;transition:width .4s ease;}

/* ── SHELL ── */
.shell{width:min(680px,calc(100% - 24px));margin:0 auto;padding:28px 0 60px;}

/* ── STEP HEADER ── */
.step-lbl{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.step-q{font-size:clamp(18px,3vw,24px);font-weight:800;color:var(--ink);line-height:1.25;margin-bottom:6px;}
.step-hint{font-size:14px;color:var(--muted);margin-bottom:22px;}

/* ── TILE GRID ── */
.tiles{display:grid;gap:12px;}
.tiles.cols2{grid-template-columns:1fr 1fr;}
.tiles.cols4{grid-template-columns:repeat(4,1fr);}
.tile{border:2px solid var(--line);border-radius:var(--r);background:var(--card);padding:16px 12px;cursor:pointer;text-align:center;transition:border-color .15s,box-shadow .15s,background .15s;user-select:none;}
.tile:hover{border-color:var(--blue2);box-shadow:0 4px 14px rgba(18,63,115,.12);}
.tile.selected{border-color:var(--blue);background:var(--lb);box-shadow:0 4px 18px rgba(18,63,115,.16);}
.tile .icon{font-size:26px;margin-bottom:6px;}
.tile .t-title{font-weight:800;font-size:15px;color:var(--blue);line-height:1.2;}
.tile .t-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4;}

/* ── USAGE TILES ── */
.usage-tile{border:2px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:14px;transition:border-color .15s,background .15s,box-shadow .15s;}
.usage-tile:hover{border-color:var(--blue2);box-shadow:0 4px 14px rgba(18,63,115,.12);}
.usage-tile.selected{border-color:var(--blue);background:var(--lb);box-shadow:0 4px 18px rgba(18,63,115,.16);}
.usage-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;margin-top:2px;}
.dot-low{background:#22c55e;}.dot-mod{background:#f59e0b;}.dot-high{background:#ef4444;}
.usage-tile .u-title{font-weight:800;font-size:16px;margin-bottom:3px;}
.usage-tile .u-desc{font-size:13px;color:var(--muted);line-height:1.5;}

/* ── CONTRIBUTION PANEL ── */
.contrib-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-top:20px;}
.contrib-panel h3{font-size:15px;font-weight:800;color:var(--blue);margin-bottom:4px;}
.contrib-panel p{font-size:13px;color:var(--muted);margin-bottom:14px;}
.toggle-row{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:fit-content;margin-bottom:16px;}
.toggle-btn{padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;border:0;background:transparent;color:var(--muted);transition:background .15s,color .15s;}
.toggle-btn.active{background:var(--blue);color:#fff;}
.contrib-input-wrap{display:flex;align-items:center;gap:10px;}
.contrib-input-wrap label{font-weight:700;font-size:13px;white-space:nowrap;}
.contrib-input-wrap input,.contrib-input-wrap select{padding:10px 12px;border:1px solid #cbd6e2;border-radius:10px;font-size:15px;width:160px;}
.contrib-note{font-size:12px;color:var(--muted);margin-top:8px;}

/* ── ADVANCED TOGGLE ── */
.adv-toggle{margin-top:18px;text-align:center;}
.adv-toggle button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--blue);font-size:13px;font-weight:700;padding:8px 18px;cursor:pointer;}
.adv-panel{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:none;}
.adv-panel.open{display:block;}
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.adv-field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--ink);}
.adv-field input,.adv-field select{width:100%;padding:9px 11px;border:1px solid #cbd6e2;border-radius:9px;font-size:14px;}
.adv-field .hint{font-size:11px;color:var(--muted);margin-top:4px;}

/* ── NOTICE ── */
.notice{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:13px;color:#92400e;margin-bottom:18px;}

/* ── NAV BUTTONS ── */
.nav{display:flex;gap:12px;margin-top:28px;}
.btn{border:0;border-radius:999px;padding:13px 28px;cursor:pointer;font-weight:800;font-size:15px;transition:opacity .15s;}
.btn-primary{background:var(--red);color:#fff;}
.btn-back{background:var(--lb);color:var(--blue);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ── RESULTS ── */
.rec-box{background:linear-gradient(135deg,#eef7f2,#d4eddf);border:1px solid #9dd4b8;border-radius:var(--r);padding:20px;margin-bottom:24px;}
.rec-box .rec-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--green);margin-bottom:6px;}
.rec-box .rec-title{font-size:20px;font-weight:800;color:#145232;margin-bottom:6px;}
.rec-box .rec-why{font-size:14px;color:#1f5c3a;line-height:1.6;}

.plan-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
.pcard.top-pick{border-color:var(--green);}
.pcard-hd{padding:14px;border-bottom:1px solid var(--line);position:relative;}
.pcard-hd .pname{font-size:17px;font-weight:800;color:var(--blue);}
.pcard-hd .pbadge{display:inline-block;background:#eef7f2;color:var(--green);border:1px solid #9dd4b8;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;margin-top:4px;}
.pcard-body{padding:14px;flex:1;}
.big-num{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
.big-lbl{font-size:12px;color:var(--muted);margin-bottom:12px;}
.prow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid #f0f4f8;font-size:13px;}
.prow:last-child{border-bottom:0;}
.prow .pk{color:var(--muted);}
.prow .pv{font-weight:700;color:var(--ink);}
.tip-btn{background:none;border:0;cursor:pointer;font-size:11px;color:var(--blue);text-decoration:underline;padding:0;margin-left:4px;font-weight:700;}
.tooltip{display:none;position:absolute;z-index:10;background:#1d2733;color:#fff;font-size:12px;border-radius:10px;padding:10px 13px;width:220px;line-height:1.5;bottom:calc(100% + 8px);left:0;box-shadow:0 8px 20px rgba(0,0,0,.2);}
.tooltip.open{display:block;}
.risk-bar-wrap{margin:14px 0 4px;}
.risk-bar-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;}
.risk-bar-bg{background:#e5e7eb;border-radius:999px;height:8px;overflow:hidden;}
.risk-bar-fill{height:8px;border-radius:999px;transition:width .5s ease;}
.pcard-foot{padding:12px 14px;background:#f8fafc;border-top:1px solid var(--line);}
details summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--blue);}
.svc-rows{margin-top:10px;}
.svc-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #f0f4f8;}
.svc-row:last-child{border-bottom:0;}
.svc-row .sk{color:var(--muted);}

/* ── FULL TABLE ── */
.tbl-section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:24px;}
.tbl-hd{background:var(--blue);color:#fff;padding:14px 16px;font-size:16px;font-weight:800;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th,td{padding:11px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--line);vertical-align:top;}
th{background:#f1f6fb;color:var(--blue);font-size:12px;white-space:nowrap;}
.best-td{background:#eef7f2 !important;}

/* ── DEFS ── */
.defs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.def{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;}
.def h4{font-size:13px;font-weight:800;color:var(--blue);margin-bottom:5px;}
.def p{font-size:12px;color:var(--muted);line-height:1.5;}

.footer-note{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
.restart-row{text-align:center;margin-top:18px;}
.restart-row button{background:var(--lb);border:1px solid var(--line);border-radius:999px;color:var(--blue);font-size:13px;font-weight:700;padding:10px 24px;cursor:pointer;}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .tiles.cols4{grid-template-columns:1fr 1fr;}
  .plan-cards{grid-template-columns:1fr;}
  .adv-grid{grid-template-columns:1fr;}
  .defs{grid-template-columns:1fr;}
}
@media(max-width:420px){
  .tiles.cols2,.tiles.cols4{grid-template-columns:1fr;}
  .nav{flex-direction:column;}
  .btn{text-align:center;}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="eyebrow">Partners for Health · 2026 Open Enrollment</div>
  <h1>Find your best health plan</h1>
  <p>Answer three quick questions and we'll estimate your total annual cost across every plan option.</p>
</header>
<div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>

<div class="shell" id="app"></div>

<script>
/* ══════════════════════════════════════════
   DATA
══════════════════════════════════════════ */
const TIERS = ["Employee Only","Employee + Child(ren)","Employee + Spouse","Employee + Spouse + Child(ren)"];

const ENTITIES = {
  state: {
    label:"State Government",
    icon:"🏛️",
    sub:"State agencies, boards & commissions",
    premType:"employee",
    plans:["Premier PPO","Standard PPO","CDHP/HSA"]
  },
  higher_ed: {
    label:"Higher Education",
    icon:"🎓",
    sub:"Universities & community colleges",
    premType:"employee",
    plans:["Premier PPO","Standard PPO","CDHP/HSA"]
  },
  local_ed: {
    label:"Local Education",
    icon:"🏫",
    sub:"K–12 school systems",
    premType:"total",
    plans:["Premier PPO","Standard PPO","Limited PPO","Local CDHP/HSA"]
  },
  local_gov: {
    label:"Local Government",
    icon:"🏙️",
    sub:"Cities, counties & utilities",
    premType:"total",
    plans:["Premier PPO","Standard PPO","Limited PPO","Local CDHP/HSA"]
  }
};

// Monthly premiums: state/higher_ed = employee share; local = total premium
const PREMIUMS = {
  state: {
    "Premier PPO":  { narrow:[177,265,398,459], broad:[267,365,578,639] },
    "Standard PPO": { narrow:[114,170,256,295], broad:[204,270,436,475] },
    "CDHP/HSA":     { narrow:[ 79,119,179,206], broad:[169,219,359,386] }
  },
  higher_ed: {
    "Premier PPO":  { narrow:[177,265,398,459], broad:[267,365,578,639] },
    "Standard PPO": { narrow:[114,170,256,295], broad:[204,270,436,475] },
    "CDHP/HSA":     { narrow:[ 79,119,179,206], broad:[169,219,359,386] }
  },
  local_ed: {
    "Premier PPO":      { narrow:[793,1307,1783,2060], broad:[883,1407,1963,2240] },
    "Standard PPO":     { narrow:[736,1214,1656,1914], broad:[826,1314,1836,2094] },
    "Limited PPO":      { narrow:[695,1146,1565,1807], broad:[785,1246,1745,1987] },
    "Local CDHP/HSA":   { narrow:[607,1001,1365,1578], broad:[697,1101,1545,1758] }
  },
  local_gov: {
    "Premier PPO":      { narrow:[904,1402,2080,2444], broad:[994,1502,2260,2624] },
    "Standard PPO":     { narrow:[832,1290,1914,2249], broad:[922,1390,2094,2429] },
    "Limited PPO":      { narrow:[675,1048,1554,1826], broad:[765,1148,1734,2006] },
    "Local CDHP/HSA":   { narrow:[624,967,1434,1685], broad:[714,1067,1614,1865] }
  }
};

const BENEFITS = {
  "Premier PPO":    { pc:[25,45], sp:[45,70], uc:[45,70], th:[15,null], rx:[7,40,90], co:[0.15,0.40], ded:[[750,1500],[1125,2250],[1500,3000],[1875,3750]], oop:[[3600,7200],[5400,10800],[7200,14400],[9000,18000]] },
  "Standard PPO":   { pc:[30,50], sp:[50,75], uc:[50,75], th:[15,null], rx:[14,50,100], co:[0.20,0.40], ded:[[1300,2600],[1950,3900],[2600,5200],[3250,6500]], oop:[[4400,8800],[6600,13200],[8800,17600],[11000,22000]] },
  "CDHP/HSA":       { pc:[0.20,0.40], sp:[0.20,0.40], uc:[0.20,0.40], th:[0.20,null], rx:[0.20,0.20,0.20], co:[0.20,0.40], ded:[[1700,3400],[3400,6800],[3400,6800],[3400,6800]], oop:[[2800,5600],[5600,11200],[5600,11200],[5600,11200]], hsa:[500,1000,1000,1000] },
  "Limited PPO":    { pc:[35,55], sp:[55,80], uc:[55,80], th:[15,null], rx:[14,60,110], co:[0.30,0.50], ded:[[1800,3600],[2500,4800],[2800,5500],[3600,7200]], oop:[[6800,13600],[13600,27200],[13600,27200],[13600,27200]] },
  "Local CDHP/HSA": { pc:[0.30,0.50], sp:[0.30,0.50], uc:[0.30,0.50], th:[0.30,null], rx:[0.30,0.30,0.30], co:[0.30,0.50], ded:[[2000,4000],[4000,8000],[4000,8000],[4000,8000]], oop:[[5000,10000],[10000,20000],[10000,20000],[10000,20000]] }
};

const PRICES = { pc:175, sp:275, uc:325, th:85, grx:25, prx:175 };

const PRESETS = {
  low:  { pc:1,sp:0,uc:0,th:1,grx:2,prx:0,major:0 },
  mod:  { pc:3,sp:2,uc:1,th:2,grx:6,prx:3,major:0 },
  high: { pc:6,sp:5,uc:2,th:3,grx:12,prx:8,major:12000 }
};

const TOOLTIPS = {
  premium:"The amount you (or your employer on your behalf) pay each month just to have coverage — whether or not you use any healthcare.",
  deductible:"The amount you pay out of your own pocket before the plan starts helping pay for most services. Preventive care (like checkups) is usually free even before you meet the deductible.",
  oop:"The most you'll ever have to pay for covered in-network care in a year. After you hit this number, the plan pays 100%. This does NOT include your monthly premium.",
  hsa:"A Health Savings Account lets you save pre-tax dollars to pay for medical costs. Your employer puts money in for free — that's a head start that lowers your real cost.",
  coinsurance:"After you meet your deductible, coinsurance is your share of each bill. For example, 20% coinsurance means the plan pays 80% and you pay 20%."
};

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
const S = {
  step: 1,
  entity: null,
  tier: null,
  network: "narrow",
  usage: null,
  contribType: "pct",   // "pct" | "dollar"
  contribPct: 80,
  contribDollar: 0,
  adv: false,
  visits: { pc:3,sp:2,uc:1,th:2,grx:6,prx:3,major:0 },
  oon: false
};

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
const fmt  = n => n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const fmt2 = n => n.toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2});
const pct  = v => v<1?`${Math.round(v*100)}%`:fmt(v);

function memberPay(val,mktPrice){ return val===null||val===undefined?0:(val<1?val*mktPrice:val); }

function employeePremium(entity, planName, network, ti){
  const base = PREMIUMS[entity][planName][network][ti];
  const ent  = ENTITIES[entity];
  if(ent.premType === "employee") return base;
  // total premium — subtract employer contribution
  if(S.contribType === "pct"){
    return Math.max(0, base * (1 - S.contribPct/100));
  } else {
    return Math.max(0, base - S.contribDollar);
  }
}

function calcCareCost(planName, ti){
  const b = BENEFITS[planName];
  const ni = S.oon ? 1 : 0;
  const v  = S.visits;
  const svc =
    v.pc  * memberPay(b.pc[ni], PRICES.pc) +
    v.sp  * memberPay(b.sp[ni], PRICES.sp) +
    v.uc  * memberPay(b.uc[ni], PRICES.uc) +
    v.th  * memberPay(b.th[ni], PRICES.th) +
    v.grx * memberPay(b.rx[0],  PRICES.grx) +
    v.prx * memberPay(b.rx[1],  PRICES.prx);
  const co = b.co[ni] || b.co[0];
  const cap = b.oop[ti][ni];
  return Math.min(svc + v.major * co, cap);
}

function buildResults(){
  const ti   = TIERS.indexOf(S.tier);
  const ent  = ENTITIES[S.entity];
  return ent.plans.map(name => {
    const b      = BENEFITS[name];
    const prem   = employeePremium(S.entity, name, S.network, ti);
    const ann    = prem * 12;
    const care   = calcCareCost(name, ti);
    const hsa    = b.hsa ? b.hsa[ti] : 0;
    const total  = Math.max(0, ann + care - hsa);
    return {
      name, prem, ann, care, hsa, total,
      ded: b.ded[ti][0], oop: b.oop[ti][0],
      pc:b.pc[0], sp:b.sp[0], uc:b.uc[0], th:b.th[0],
      rx:b.rx, co:b.co[0]
    };
  }).sort((a,b)=>a.total-b.total);
}

function recText(results){
  const best  = results[0];
  const isHSA = best.name.includes("HSA");
  const isLP  = best.name === "Limited PPO";
  let why = "";
  if(isHSA){
    why = `It has the lowest monthly premium and — when you factor in your employer's HSA contribution — the lowest total estimated cost. Because you don't use healthcare very often, you're unlikely to hit your deductible, so you keep more money in your pocket. The HSA also lets you save pre-tax money for future medical costs.`;
  } else if(S.usage === "high"){
    why = `With frequent healthcare needs, a higher monthly premium in exchange for lower copays and a lower out-of-pocket maximum gives you the most financial protection. The ${best.name} limits your worst-case annual cost better than the other options.`;
  } else if(isLP){
    why = `Given your coverage level and usage, the ${best.name} offers the best balance of premium cost and out-of-pocket exposure for your situation.`;
  } else {
    why = `It balances a reasonable monthly premium with solid coverage for the number of visits and prescriptions you expect. You won't overpay on premiums, and your estimated out-of-pocket costs stay manageable.`;
  }
  return why;
}

/* ══════════════════════════════════════════
   RENDER ENGINE
══════════════════════════════════════════ */
const app  = document.getElementById("app");
const fill = document.getElementById("progFill");

function setProgress(n){ fill.style.width = n + "%"; }

function render(){
  if(S.step===1) renderStep1();
  else if(S.step===2) renderStep2();
  else if(S.step===3) renderStep3();
  else renderResults();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ── STEP 1: Entity + Tier ── */
function renderStep1(){
  setProgress(10);
  app.innerHTML = `
    <div class="step-lbl">Step 1 of 3</div>
    <div class="step-q">Which group are you in?</div>
    <div class="step-hint">This determines which plans and premium rates apply to you.</div>
    <div class="tiles cols2" id="entityTiles">
      ${Object.entries(ENTITIES).map(([k,v])=>`
        <div class="tile${S.entity===k?' selected':''}" data-val="${k}" id="ent_${k}">
          <div class="icon">${v.icon}</div>
          <div class="t-title">${v.label}</div>
          <div class="t-sub">${v.sub}</div>
        </div>`).join("")}
    </div>

    <div style="height:28px"></div>
    <div class="step-q">Who are you covering?</div>
    <div class="step-hint">Choose the coverage level that matches your family situation.</div>
    <div class="tiles cols2" id="tierTiles">
      ${[
        ["Employee Only","Just me","👤"],
        ["Employee + Child(ren)","Me and my kids","👨‍👧"],
        ["Employee + Spouse","Me and my spouse/partner","👫"],
        ["Employee + Spouse + Child(ren)","My whole family","👨‍👩‍👧"]
      ].map(([val,lbl,ico])=>`
        <div class="tile${S.tier===val?' selected':''}" data-tier="${val}">
          <div class="icon">${ico}</div>
          <div class="t-title">${lbl}</div>
          <div class="t-sub">${val}</div>
        </div>`).join("")}
    </div>

    <div class="nav">
      <button class="btn btn-primary" id="s1Next" ${(!S.entity||!S.tier)?'disabled':''}>Next: How do you use healthcare? →</button>
    </div>`;

  app.querySelectorAll("[data-val]").forEach(el=>{
    el.addEventListener("click",()=>{ S.entity=el.dataset.val; render(); });
  });
  app.querySelectorAll("[data-tier]").forEach(el=>{
    el.addEventListener("click",()=>{ S.tier=el.dataset.tier; render(); });
  });
  document.getElementById("s1Next")?.addEventListener("click",()=>{ S.step=2; render(); });
}

/* ── STEP 2: Usage + Network + Contribution ── */
function renderStep2(){
  setProgress(45);
  const isLocal = S.entity==="local_ed"||S.entity==="local_gov";
  app.innerHTML = `
    <div class="step-lbl">Step 2 of 3</div>
    <div class="step-q">How often do you typically use healthcare?</div>
    <div class="step-hint">Pick the option that feels most like you. You can fine-tune below.</div>
    <div class="tiles" style="gap:10px" id="usageTiles">
      ${[
        ["low","🟢","Rarely","I'm generally healthy — mostly just annual checkups and maybe a prescription or two.","dot-low"],
        ["mod","🟡","Sometimes","I go to the doctor a few times a year, see a specialist occasionally, and take some regular medications.","dot-mod"],
        ["high","🔴","Often","I manage an ongoing condition, see specialists regularly, or expect a major procedure this year.","dot-high"]
      ].map(([k,,title,desc,dot])=>`
        <div class="usage-tile${S.usage===k?' selected':''}" data-usage="${k}">
          <div class="usage-dot ${dot}"></div>
          <div><div class="u-title">${title}</div><div class="u-desc">${desc}</div></div>
        </div>`).join("")}
    </div>

    <div class="adv-toggle">
      <button id="advToggle">⚙️ Adjust visit counts &amp; details</button>
    </div>
    <div class="adv-panel${S.adv?' open':''}" id="advPanel">
      <div class="adv-grid">
        <div class="adv-field"><label>Primary care visits</label><input type="number" id="apc" min="0" value="${S.visits.pc}"/></div>
        <div class="adv-field"><label>Specialist visits</label><input type="number" id="asp" min="0" value="${S.visits.sp}"/></div>
        <div class="adv-field"><label>Urgent care visits</label><input type="number" id="auc" min="0" value="${S.visits.uc}"/></div>
        <div class="adv-field"><label>Telehealth visits</label><input type="number" id="ath" min="0" value="${S.visits.th}"/></div>
        <div class="adv-field"><label>Generic Rx fills (30-day)</label><input type="number" id="agrx" min="0" value="${S.visits.grx}"/></div>
        <div class="adv-field"><label>Preferred Rx fills (30-day)</label><input type="number" id="aprx" min="0" value="${S.visits.prx}"/></div>
        <div class="adv-field" style="grid-column:1/-1">
          <label>Estimated major medical claims ($)</label>
          <input type="number" id="amaj" min="0" step="500" value="${S.visits.major}"/>
          <div class="hint">Surgery, hospitalization, imaging, ER visits, etc.</div>
        </div>
        <div class="adv-field">
          <label>Out-of-network use?</label>
          <select id="aoon"><option value="false"${!S.oon?' selected':''}>No – stay in-network</option><option value="true"${S.oon?' selected':''}>Some out-of-network</option></select>
        </div>
      </div>
    </div>

    <div style="height:24px"></div>
    <div class="step-q" style="font-size:18px">Which network do you prefer?</div>
    <div class="step-hint">Not sure? Narrow networks cost less per month. Check if your doctors are in-network at bcbst.com or cigna.com.</div>
    <div class="tiles cols2" id="netTiles">
      <div class="tile${S.network==='narrow'?' selected':''}" data-net="narrow">
        <div class="icon">📍</div>
        <div class="t-title">Narrower network</div>
        <div class="t-sub">Lower monthly premiums · BCBST Network S / Cigna LocalPlus</div>
      </div>
      <div class="tile${S.network==='broad'?' selected':''}" data-net="broad">
        <div class="icon">🌐</div>
        <div class="t-title">Broader network</div>
        <div class="t-sub">More provider choices · BCBST Network P / Cigna Open Access</div>
      </div>
    </div>

    ${isLocal ? `
    <div class="contrib-panel">
      <h3>What does your employer contribute?</h3>
      <p>Local agencies vary in how much they cover. Enter what you know — check your benefits letter or HR portal if unsure.</p>
      <div class="toggle-row">
        <button class="toggle-btn${S.contribType==='pct'?' active':''}" id="tPct">% of premium</button>
        <button class="toggle-btn${S.contribType==='dollar'?' active':''}" id="tDollar">$ per month</button>
      </div>
      <div class="contrib-input-wrap" id="contribInput">
        ${S.contribType==='pct'
          ? `<label>Employer pays</label>
             <select id="contribVal">
               ${[0,25,50,75,80,100].map(n=>`<option value="${n}"${S.contribPct===n?' selected':''}>${n}%</option>`).join("")}
             </select>
             <span style="font-size:14px;color:var(--muted)">of the total premium</span>`
          : `<label>Employer pays</label>
             <input type="number" id="contribVal" min="0" step="25" value="${S.contribDollar}" style="width:140px"/>
             <span style="font-size:14px;color:var(--muted)">per month</span>`
        }
      </div>
      <div class="contrib-note" id="contribNote"></div>
    </div>` : ""}

    <div class="nav">
      <button class="btn btn-back" id="s2Back">← Back</button>
      <button class="btn btn-primary" id="s2Next" ${!S.usage?'disabled':''}>See my plan options →</button>
    </div>`;

  // usage tiles
  app.querySelectorAll("[data-usage]").forEach(el=>{
    el.addEventListener("click",()=>{
      S.usage=el.dataset.usage;
      const p=PRESETS[S.usage];
      Object.assign(S.visits,p);
      // update adv inputs if open
      ["pc","sp","uc","th","grx","prx","major"].forEach(k=>{
        const el=document.getElementById("a"+k); if(el) el.value=S.visits[k];
      });
      render();
    });
  });

  // adv toggle
  document.getElementById("advToggle")?.addEventListener("click",()=>{ S.adv=!S.adv; render(); });

  // adv inputs
  ["pc","sp","uc","th","grx","prx","major"].forEach(k=>{
    document.getElementById("a"+k)?.addEventListener("input",e=>{
      S.visits[k]=+e.target.value||0; S.usage=null;
      app.querySelectorAll("[data-usage]").forEach(t=>t.classList.remove("selected"));
    });
  });
  document.getElementById("aoon")?.addEventListener("change",e=>{ S.oon=e.target.value==="true"; });

  // network tiles
  app.querySelectorAll("[data-net]").forEach(el=>{
    el.addEventListener("click",()=>{ S.network=el.dataset.net; render(); });
  });

  // contribution
  if(isLocal){
    document.getElementById("tPct")?.addEventListener("click",()=>{ S.contribType="pct"; render(); });
    document.getElementById("tDollar")?.addEventListener("click",()=>{ S.contribType="dollar"; render(); });
    document.getElementById("contribVal")?.addEventListener("change",e=>{
      if(S.contribType==="pct") S.contribPct=+e.target.value;
      else S.contribDollar=+e.target.value||0;
      updateContribNote();
    });
    document.getElementById("contribVal")?.addEventListener("input",e=>{
      if(S.contribType==="dollar"){ S.contribDollar=+e.target.value||0; updateContribNote(); }
    });
    updateContribNote();
  }

  document.getElementById("s2Back")?.addEventListener("click",()=>{ S.step=1; render(); });
  document.getElementById("s2Next")?.addEventListener("click",()=>{ S.step=4; render(); });
}

function updateContribNote(){
  const note=document.getElementById("contribNote"); if(!note) return;
  const ti=TIERS.indexOf(S.tier);
  const plans=ENTITIES[S.entity].plans;
  const maxPrem=Math.max(...plans.map(p=>PREMIUMS[S.entity][p][S.network][ti]));
  const minPrem=Math.min(...plans.map(p=>PREMIUMS[S.entity][p][S.network][ti]));
  if(S.contribType==="pct"){
    const minEmp=Math.max(0,minPrem*(1-S.contribPct/100));
    const maxEmp=Math.max(0,maxPrem*(1-S.contribPct/100));
    note.textContent=`Your estimated monthly employee cost: ${fmt2(minEmp)} – ${fmt2(maxEmp)} depending on plan.`;
  } else {
    if(S.contribDollar>=minPrem) note.textContent="⚠️ Your employer may cover some plans in full — your cost could be $0. Confirm with HR.";
    else { const minEmp=Math.max(0,minPrem-S.contribDollar); const maxEmp=Math.max(0,maxPrem-S.contribDollar); note.textContent=`Your estimated monthly employee cost: ${fmt2(minEmp)} – ${fmt2(maxEmp)} depending on plan.`; }
  }
}

/* ── RESULTS ── */
function renderResults(){
  setProgress(100);
  const results = buildResults();
  const best    = results[0];
  const maxOop  = Math.max(...results.map(r=>r.oop));

  app.innerHTML = `
    <div class="step-lbl">Your results</div>
    <div class="rec-box">
      <div class="rec-label">✓ Our estimate for you</div>
      <div class="rec-title">The ${best.name} looks like your best fit.</div>
      <div class="rec-why">${recText(results)}</div>
    </div>

    <div class="notice">
      <strong>These are estimates.</strong> Your actual costs depend on your claims, provider choices, and plan documents. Always confirm details with your HR office or at <a href="https://www.tn.gov/partnersforhealth" target="_blank" rel="noopener">tn.gov/partnersforhealth</a>.
    </div>

    <div class="plan-cards" id="planCards">
      ${results.map((r,i)=>planCard(r,i,maxOop)).join("")}
    </div>

    <div class="tbl-section">
      <div class="tbl-hd">Full comparison table</div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>Plan</th><th>Est. total annual cost</th><th>Est. care cost</th>
            <th>Monthly premium</th><th>Annual premium</th>
            <th>Deductible (in-net)</th><th>OOP max (in-net)</th>
            <th>Primary / Specialist</th><th>Rx: G / P / NP</th>
          </tr></thead>
          <tbody>
            ${results.map((r,i)=>`<tr>
              <td${i===0?' class="best-td"':''}><strong>${r.name}</strong>${i===0?' ✓':''}</td>
              <td${i===0?' class="best-td"':''}>${fmt(r.total)}</td>
              <td>${fmt(r.care)}</td>
              <td>${fmt2(r.prem)}</td>
              <td>${fmt(r.ann)}</td>
              <td>${fmt(r.ded)}</td>
              <td>${fmt(r.oop)}</td>
              <td>${pct(r.pc)} / ${pct(r.sp)}</td>
              <td>${r.rx.map(pct).join(" / ")}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="defs">
      ${Object.entries({
        "Monthly premium": TOOLTIPS.premium,
        "Deductible": TOOLTIPS.deductible,
        "Out-of-pocket maximum": TOOLTIPS.oop
      }).map(([t,d])=>`<div class="def"><h4>${t}</h4><p>${d}</p></div>`).join("")}
    </div>

    <p class="footer-note">Estimated total annual cost = annual premiums + estimated out-of-pocket care costs${best.hsa?", minus the estimated employer HSA contribution":""}. The out-of-pocket maximum applies to covered eligible in-network costs and does not include premiums. Dental, vision, life, and disability coverage are not included in this comparison.</p>

    <div class="restart-row">
      <button id="restartBtn">← Start over</button>
    </div>`;

  document.getElementById("restartBtn")?.addEventListener("click",()=>{
    Object.assign(S,{step:1,entity:null,tier:null,network:"narrow",usage:null,contribType:"pct",contribPct:80,contribDollar:0,adv:false,visits:{pc:3,sp:2,uc:1,th:2,grx:6,prx:3,major:0},oon:false});
    render();
  });

  // tooltip handlers
  app.querySelectorAll(".tip-btn").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const tt=document.getElementById(btn.dataset.tip);
      if(!tt) return;
      app.querySelectorAll(".tooltip.open").forEach(t=>{ if(t!==tt) t.classList.remove("open"); });
      tt.classList.toggle("open");
    });
  });
  document.addEventListener("click",()=>{ app.querySelectorAll(".tooltip.open").forEach(t=>t.classList.remove("open")); },{once:false});
}

function planCard(r, i, maxOop){
  const riskPct = Math.round((r.oop/maxOop)*100);
  const isHSA   = r.name.includes("HSA");
  return `
    <div class="pcard${i===0?' top-pick':''}">
      <div class="pcard-hd">
        <div class="pname">${r.name}</div>
        ${i===0?'<div class="pbadge">✓ Lowest estimated cost</div>':''}
        ${isHSA?`<div style="margin-top:6px;font-size:11px;color:var(--green);font-weight:700;">💰 HSA-eligible — employer contributes ${fmt(r.hsa)}</div>`:''}
      </div>
      <div class="pcard-body">
        <div class="big-num">${fmt(r.total)}</div>
        <div class="big-lbl">estimated total annual cost</div>
        <div class="prow">
          <span class="pk">Monthly premium <button class="tip-btn" data-tip="tt_prem_${i}">?</button>
            <div class="tooltip" id="tt_prem_${i}">${TOOLTIPS.premium}</div></span>
          <span class="pv">${fmt2(r.prem)}</span>
        </div>
        <div class="prow">
          <span class="pk">Deductible <button class="tip-btn" data-tip="tt_ded_${i}">?</button>
            <div class="tooltip" id="tt_ded_${i}">${TOOLTIPS.deductible}</div></span>
          <span class="pv">${fmt(r.ded)}</span>
        </div>
        <div class="prow">
          <span class="pk">OOP max <button class="tip-btn" data-tip="tt_oop_${i}">?</button>
            <div class="tooltip" id="tt_oop_${i}">${TOOLTIPS.oop}</div></span>
          <span class="pv">${fmt(r.oop)}</span>
        </div>
        <div class="risk-bar-wrap">
          <div class="risk-bar-lbl"><span>Financial risk</span><span>${riskPct}%</span></div>
          <div class="risk-bar-bg"><div class="risk-bar-fill" style="width:${riskPct}%;background:${riskPct<50?'#22c55e':riskPct<80?'#f59e0b':'#ef4444'};"></div></div>
        </div>
      </div>
      <div class="pcard-foot">
        <details>
          <summary>Common service costs</summary>
          <div class="svc-rows">
            <div class="svc-row"><span class="sk">Primary care visit</span><span>${pct(r.pc)}</span></div>
            <div class="svc-row"><span class="sk">Specialist visit</span><span>${pct(r.sp)}</span></div>
            <div class="svc-row"><span class="sk">Urgent care visit</span><span>${pct(r.uc)}</span></div>
            <div class="svc-row"><span class="sk">Telehealth</span><span>${r.th!==null?pct(r.th):"N/A"}</span></div>
            <div class="svc-row"><span class="sk">30-day Rx (G/P/NP)</span><span>${r.rx.map(pct).join(" / ")}</span></div>
            <div class="svc-row"><span class="sk">Hospital coinsurance</span><span>${Math.round(r.co*100)}%</span></div>
          </div>
        </details>
      </div>
    </div>`;
}

render();
</script>
</body>
</html>
